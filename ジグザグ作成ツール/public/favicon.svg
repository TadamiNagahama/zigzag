<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 完全透過背景 -->
  <style>
    .z-blue { stroke: #0047AB; stroke-width: 85; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .z-red { stroke: #D22B2B; stroke-width: 85; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- 1. 下層：まずは全体を描画 -->
  <path id="blueZ" class="z-blue" d="M110 110 H412 L110 412 H412" />
  <path id="redZ" class="z-red" d="M85 145 H387 L85 447 H387" />

  <!-- 2. エッシャー的な重なり（3番をベースに、入れ替えを適用） -->
  <!-- 
    3番の画像では：
    - 左上（青の斜め vs 赤の上棒）で 青が上
    - 右下（赤の斜め vs 青の下棒）で 赤が上
    
    入れ替え後のご要望：
    - 左上付近で「赤が上」（これは単に後から描画すればOK）
    - 右下付近で「青が上」
  -->

  <!-- 右下交差（青の下棒が赤の斜めの上に来るようにする） -->
  <g clip-path="inset(300px 0 0 200px)">
    <use href="#blueZ" />
  </g>
</svg>